#đặt tên cho workflow này trên github actions UI
name: Build and Push Docker Image

on:
  push:
    branches:
      - master  # chỉ chạy khi push lên nhánh main

jobs: #tập hợp các job sẽ thực thi
  build-and-push: # Job 1 : Build + push lên Gitlab Registry
    runs-on: ubuntu-latest #chọn môi trường runner

    steps: #các bước thực hiện job
      - name: Checkout repository #bước 1: checkout code
        uses: actions/checkout@v3

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t registry.gitlab.com/anhthenguyen2810-group/hethongdatban:latest .

      - name: Push Docker image
        run: |
          docker push registry.gitlab.com/anhthenguyen2810-group/hethongdatban:latest

      
  deploy-local: # Job 2: Deploy xuống WSL local (chạy bằng seft-hosted runner)
    runs-on: seft-hosted #chọn môi trường runner
    needs: build-and-push #job này phụ thuộc vào job build-and-push, tức là job này sẽ chạy sau khi job build-and-push hoàn thành
    steps: #các bước thực hiện job
      - name: Checkout repository #bước 1: checkout code
        uses: actions/checkout@v3

      - name: Pull image latest
        run: |
            docker pull registry.gitlab.com/anhthenguyen2810-group/hethongdatban:latest

      - name: Run container from latest image
        run: |
          docker stop hethongdatban-container || true 
          docker rm hethongdatban-container || true
          docker run -d -p 8080:8080 --name hethongdatban-container registry.gitlab.com/anhthenguyen2810-group/hethongdatban:latest

